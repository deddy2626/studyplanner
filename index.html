<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Petal Study Planner</title>
  <meta name="description" content="A cute, simple study planner: subjects, daily study blocks, a focus timer and progress tracking.">
  <meta name="theme-color" content="#fff3f6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f27aa4' d='M12 21s-7.5-4.6-9.5-9.3C1.2 8.4 3 5 6.3 5c2.1 0 3.6 1.1 5.7 3.3C14.1 6.1 15.6 5 17.7 5 21 5 22.8 8.4 21.5 11.7 19.5 16.4 12 21 12 21z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Main">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="var(--accent)" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.3C1.2 8.4 3 5 6.3 5c2.1 0 3.6 1.1 5.7 3.3C14.1 6.1 15.6 5 17.7 5 21 5 22.8 8.4 21.5 11.7 19.5 16.4 12 21 12 21z"/></svg>
        Petal
      </div>
      <div id="sideTabs"></div>
    </aside>
    <main id="main"></main>
  </div>

  <nav class="tabs" id="bottomTabs" aria-label="Main"></nav>

  <button class="fab" id="fab" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Add
  </button>

  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>

  <noscript>Petal needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
